# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.config/tmux/tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 100

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# enable vi mode keys
set-window-option -g mode-keys vi

# set default terminal mode to 256 colors
set -g default-terminal "xterm-256color"
set -as terminal-features ',xterm*:RGB'

# allow focus events to get through to applications running in tmux
set -g focus-events on


# Design Tweaks
# -------------

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity on
set -g bell-action none

#  modes
setw -g clock-mode-colour yellow
setw -g mode-style 'fg=black bg=yellow bold'

# panes
set -g pane-border-style 'fg=yellow'
set -g pane-active-border-style 'fg=red'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=green'

set -g status-left-style "bg=red"
set -g status-left '#{?client_prefix,#[bg=red],#[bg=terminal]}  '
set -g status-left-length 10


set -g status-right-style 'fg=black bg=yellow'
set -g status-right '#[bg=magenta fg=black]#S#[bg=green]  #[bg=blue fg=black] %Y-%m-%d %H:%M'

setw -g window-status-current-style 'fg=black bg=yellow bold'
setw -g window-status-current-format '#I #W #F'

setw -g window-status-style 'bg=green'
setw -g window-status-separator '#[fg=white] | '
setw -g window-status-format '#[fg=black]#I #[fg=black]#W #[fg=black]#F'

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=terminal bold'

